name: release

# Trusted publishing for conformal-oracle. PyPI must list exactly one trusted
# publisher for this project, matching the repository that carries this file,
# the file name release.yml and the environment name pypi below. Two
# repositories hold this workflow, so only one of them may be registered on
# PyPI at a time; the other's tags will build and then be refused at the
# publish step, which is the intended behaviour.

on:
  push:
    tags:
      - 'v*-python'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: |
          cd python
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/conformal-oracle/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
