name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  base:
    name: Base (no TSFMs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          cd python
          pip install -e ".[dev]"
      - name: Lint
        run: |
          cd python
          ruff check src/
      - name: Type check
        continue-on-error: true
        run: |
          cd python
          mypy --strict src/conformal_oracle/
      - name: Test
        run: |
          cd python
          pytest --cov=conformal_oracle --cov-report=xml -v
      - name: Coverage
        uses: codecov/codecov-action@v4
        with:
          files: python/coverage.xml

  chronos:
    name: Chronos extra
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-${{ runner.os }}-v1
      - name: Install
        run: |
          cd python
          pip install -e ".[dev,chronos]"
      - name: Test Chronos
        run: |
          cd python
          pytest tests/test_tsfm/test_chronos.py -v
      - name: Test Replication
        run: |
          cd python
          pytest tests/test_tsfm/test_replication.py -v

  lag_llama:
    name: Lag-Llama extra
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-lagllama-${{ runner.os }}-v1
      - name: Install
        run: |
          cd python
          pip install -e ".[dev,lag_llama]"
          pip install git+https://github.com/time-series-foundation-models/lag-llama.git
      - name: Test
        run: |
          cd python
          pytest tests/test_tsfm/test_lag_llama.py -v

  timesfm:
    name: TimesFM extra
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-${{ runner.os }}-v1
      - name: Install
        run: |
          cd python
          pip install torch>=2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,timesfm]"
          pip install git+https://github.com/google-research/timesfm.git
      - name: Test
        run: |
          cd python
          pytest tests/test_tsfm/test_timesfm.py -v

  moirai:
    name: Moirai extra
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-moirai-${{ runner.os }}-v1
      - name: Install
        run: |
          cd python
          pip install torch>=2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,moirai]"
      - name: Test Moirai
        run: |
          cd python
          pytest tests/test_tsfm/test_moirai.py -v
      - name: Test Within-Family Contrast
        run: |
          cd python
          pytest tests/test_tsfm/test_within_family.py -v

  long_run:
    name: Long-run replication
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-longrun-${{ runner.os }}-v1
      - name: Install all TSFMs
        run: |
          cd python
          pip install torch>=2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,tsfm_all]"
          pip install git+https://github.com/time-series-foundation-models/lag-llama.git
          pip install git+https://github.com/google-research/timesfm.git
      - name: Run full replication
        run: |
          cd python
          pytest tests/test_tsfm/ -v --tb=short
